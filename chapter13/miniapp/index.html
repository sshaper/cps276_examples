<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter 13 - Notes Mini-App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <h1>Notes Mini-App</h1>
  <form id="noteForm" class="mb-3">
    <label for="noteText" class="form-label">New note</label>
    <input id="noteText" class="form-control" required>
    <button class="btn btn-primary mt-2">Add Note</button>
  </form>
  <p id="message"></p>
  <ul id="noteList"></ul>
  <script src="app.js"></script>
</body>
</html>
