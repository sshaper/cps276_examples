<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter 13 - File Upload</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <h1>File Upload with Fetch</h1>
  <p>Sample image: <a href="picToUse/student_coding_web_application.png">image</a></p>
  <form id="fileUploadForm">
    <div class="mb-3">
      <label for="fileName" class="form-label">File Name</label>
      <input type="text" class="form-control" id="fileName" name="fileName" placeholder="Enter file name" required>
    </div>
    <div class="mb-3">
      <label for="fileInput" class="form-label">Upload File</label>
      <input type="file" class="form-control" id="fileInput" name="file" required>
    </div>
    <button type="submit" class="btn btn-primary">Upload</button>
  </form>
  <div id="responseMessage" class="mt-3"></div>
  <script src="app.js"></script>
</body>
</html>
