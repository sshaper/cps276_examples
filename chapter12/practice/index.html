<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter 12 - Practice Name List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <h1>Name List Practice</h1>
  <form id="nameForm" class="mb-3">
    <input id="nameInput" class="form-control" placeholder="Enter a name">
    <button class="btn btn-primary mt-2">Add Name</button>
  </form>
  <label class="form-label">Filter</label>
  <input id="filterInput" class="form-control mb-3" placeholder="Filter names">
  <p id="error" class="text-danger"></p>
  <ul id="nameList"></ul>
  <script src="app.js"></script>
</body>
</html>
